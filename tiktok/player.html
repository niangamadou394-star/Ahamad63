<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur — De l’idée au lancement</title>
<link rel="stylesheet" href="engine/style.css">
<style>
  body.preview{height:100vh;display:grid;place-items:center;background:#000}
  body.preview .frame{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
  body.capture{width:1080px;height:1920px}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script src="episodes.js"></script>
<script src="engine/engine.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const n = +(q.get('ep') || 1);
  const capture = q.has('capture');
  document.body.className = capture ? 'capture' : 'preview';
  const ep = EPISODES.find(e => e.n === n) || EPISODES[0];
  document.title = `Ép. ${String(ep.n).padStart(2, '0')} — ${ep.title}`;
  await document.fonts.load('900 100px "Playfair Display"');
  await document.fonts.load('italic 700 100px "Playfair Display"');
  await document.fonts.load('400 100px "DM Sans"');
  await document.fonts.ready;

  const frame = document.getElementById('frame');
  const v = MotionEngine.build(ep, frame);
  MotionEngine.fit(v.stage);

  const all = () => document.getAnimations();
  window.__duration = v.total;
  window.__cues = v.cues;
  window.__starts = v.starts;
  window.__seek = t => { for (const a of all()) { a.pause(); a.currentTime = t * 1000; } };

  if (capture) { window.__seek(0); window.__ready = true; return; }

  // Aperçu : mise à l'échelle + lecture en boucle (clic = rejouer, espace = pause)
  const resize = () => {
    const s = Math.min(innerHeight / 1920, innerWidth / 1080) * .96;
    frame.style.width = 1080 * s + 'px';
    frame.style.height = 1920 * s + 'px';
    v.stage.style.transform = `scale(${s})`;
  };
  resize(); addEventListener('resize', resize);
  const restart = () => all().forEach(a => { a.currentTime = 0; a.play(); });
  let start = performance.now();
  restart();
  frame.addEventListener('click', () => { restart(); start = performance.now(); });
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    const playing = all().some(a => a.playState === 'running');
    all().forEach(a => playing ? a.pause() : a.play());
  });
  (function loop() {
    const t = (all()[0]?.currentTime || 0) / 1000;
    if (t >= v.total && !q.has('noloop')) { restart(); }
    requestAnimationFrame(loop);
  })();
  window.__ready = true;
})();
</script>
</body>
</html>
