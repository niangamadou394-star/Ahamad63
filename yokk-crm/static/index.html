<style>

:root{

.due{font-size:11.5px;font-weight:600}.due.late{color:var(--bad)}.due.today{color:var(--warn)}

td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--surface2)}
td .who{display:flex;align-items:center;gap:6px}td .who img{width:22px;height:22px;border-radius:50%}
.tasks{display:grid;gap:16px}
.tl{list-style:none;margin:0;padding:0}

.mem .h{display:flex;gap:12px;align-items:center}
.mem .h img{width:44px;height:44px;border-radius:50%}

.mem .now{margin:10px 0;font-size:12.5px;color:var(--muted);min-height:20px}
.mem dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}

.mem dt{font-size:11px;color:var(--muted);font-weight:600}
.mem dd{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:13.5px}
.drawer{position:fixed;inset:0;z-index:20;display:none}
.drawer.open{display:block}
.drawer .ov{position:absolute;inset:0;background:#0008}

.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hist{margin-top:22px}
.err{color:var(--bad);font-size:12.5px;margin-top:8px}

.ro .wr{display:none!important}

.lbl.person img{width:22px;height:22px;border-radius:50%}.lbl.person span{display:grid;line-height:1.2}.lbl.person em{font-style:normal;color:var(--muted);font-size:10.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis}

#v3dTools{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#v3dPanel .muted{color:var(--muted);font-size:12.5px;margin:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}.kv div{background:var(--surface2);border-radius:10px;padding:7px 10px;min-width:0}.kv .full{grid-column:1/-1}
.kv dt{font-size:11px;color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.who{display:inline-flex;align-items:center;gap:6px}.who img{width:22px;height:22px;border-radius:50%}
.notes{font-size:12.5px;background:var(--surface2);border-radius:10px;padding:8px 10px;margin:10px 0 0;white-space:pre-wrap}
.mv{display:flex;gap:6px;flex-wrap:wrap}
.zl{display:grid;gap:6px;margin-top:10px}.zl button{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}.zl button:hover{border-color:var(--accent)}.zl span{color:var(--muted);font-size:12px}
@media (max-width:700px){#v3d{height:calc(100vh - 110px)}#v3dPanel{top:auto;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:55%}#v3dKpi div:nth-child(n+3){display:none}#v3dTools .hint{display:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<style>

<script>
/* Adaptateur : données dans Google Sheets via Apps Script (gratuit), présence en direct, équipe */
(() => {
  const L = {}, cache = { prospects: [], taches: [], activite: [] }; let ver = -1, started = false, peers = [], membres = [], pres = {}; const PL = [];
  const get = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const who = () => get("yokk-nom") || "Équipe", code = () => get("yokk-code");

  const snap = c => ({ docs: cache[c].map(d => { const { id, ...rest } = d; return { id, exists: true, data: () => rest }; }), size: cache[c].length, empty: !cache[c].length, metadata: { fromCache: false, hasPendingWrites: false } });
  const emit = () => Object.entries(L).forEach(([c, fs]) => fs.forEach(f => f(snap(c))));
  const setPeers = (p, m) => { if (m) membres = m; if (p) { peers = p; PL.forEach(f => f({ peers })); } };
  async function pull(force) { try { if (!force) { const j = await api({ action: "ping", presence: pres }); setPeers(j.peers, j.membres); if (j.v === ver) return; } const j = await api({ action: "all" }); ver = j.v; Object.assign(cache, j.data); setPeers(j.peers, j.membres); emit(); } catch (e) {} }
  const start = () => { if (started) return; started = true; if (!code()) return showLogin(); pull(true); setInterval(pull, 15000); document.addEventListener("visibilitychange", () => !document.hidden && pull()); };
  const write = async (action, col, id, data) => { const i = cache[col].findIndex(d => d.id === id);
    if (action === "put") { if (i >= 0) cache[col][i] = { id, ...data }; else cache[col].push({ id, ...data }); } else if (i >= 0) cache[col].splice(i, 1);
    if (col === "activite") cache.activite.sort((a, b) => b.le - a.le);
    emit(); await api({ action, col, id, data }); ver = -1; };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docRef = (col, id) => ({ id, path: col + "/" + id, set: d => write("put", col, id, d),
    update: d => { const cur = cache[col].find(x => x.id === id) || {}; const { id: _, ...rest } = cur; return write("put", col, id, { ...rest, ...d }); }, delete: () => write("del", col, id) });
  const collection = c => { const q = { orderBy() { return q; }, limit() { return q; }, where() { return q; },
    onSnapshot(next) { (L[c] = L[c] || []).push(next); start(); if (ver >= 0) setTimeout(() => next(snap(c)), 0); return () => { L[c] = L[c].filter(f => f !== next); }; },
    get: async () => snap(c), doc: id => docRef(c, id || newId()), add: async d => { const id = newId(); await write("put", c, id, d); return docRef(c, id); } }; return q; };
  const COL = ["#0f5a42", "#b8862e", "#2563a8", "#c2410c", "#7a4fb5", "#0f8a6a", "#a3365d", "#5e6f68"];
  const avatar = n => { let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const ini = n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
    return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="${COL[h % COL.length]}"/><text x="32" y="41" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">${ini.replace(/[<&>"]/g, "")}</text></svg>`); };
  const prof = n => ({ id: n, name: n, avatarUrl: avatar(n) });
  const user = { id: async () => who(), can: async () => true, profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, prof(i)])),
    search: async q => { q = String(q || "").toLowerCase(); return [...new Set([...membres, who()])].filter(n => n.toLowerCase().includes(q)).slice(0, 8).map(prof); } };
  let pt = 0; const room = { presence: async p => { pres = p || {}; clearTimeout(pt); pt = setTimeout(() => api({ action: "ping", presence: pres }).then(j => setPeers(j.peers, j.membres)).catch(() => {}), 800); },
    peers: () => peers, onPeers: f => { PL.push(f); return () => PL.splice(PL.indexOf(f), 1); } };
  window.claude = { use: async n => ({ db: { collection, doc: p => { const [c, id] = p.split("/"); return docRef(c, id); } }, user, room })[n] || null };
  const LOGO = `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="#b8862e" stroke-width="8"/><g fill="none" stroke="#b8862e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M100 160 V112 L74 80"/><path d="M100 112 L141 56"/><path d="M116 52 H144 V80"/></g><circle cx="58" cy="59" r="12" fill="#b8862e"/></svg>`;
  function showLogin() {
    if (document.getElementById("login")) return;
    const d = document.createElement("div"); d.id = "login";
    d.innerHTML = `<form id="lf"><div class="lb">${LOGO}YOKK</div><small>CRM de l'équipe</small>
      <label>Votre prénom<input id="ln" required autocomplete="given-name"></label>
      <label>Code d'accès<input id="lc" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrer</button><p id="le" class="err" hidden></p></form>`;
    document.body.appendChild(d); document.getElementById("ln").value = who() === "Équipe" ? "" : who();
    document.getElementById("lf").onsubmit = async e => { e.preventDefault(); const c = document.getElementById("lc").value, n = document.getElementById("ln").value.trim() || "Équipe", p = document.getElementById("le");
      let j; try { const r = await fetch(window.YOKK_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "login", code: c, nom: n }) }); j = await r.json(); }
      catch (x) { p.hidden = false; p.textContent = "Serveur injoignable : vérifiez que le déploiement Apps Script est en accès « Tout le monde »."; return; }
      if (j.error === "server") { p.hidden = false; p.textContent = "Erreur du serveur Google : " + (j.message || ""); return; }
      if (!j.ok) { p.hidden = false; p.textContent = "Code incorrect."; return; }
      try { localStorage.setItem("yokk-code", c); localStorage.setItem("yokk-nom", n); } catch (x) {}
      location.reload(); };
  }
})();
</script>

    <div class="live" id="live" title="Membres de l'équipe connectés"><i class="dot"></i><div class="stack" id="stack"></div><span id="liveTxt">Connexion…</span></div>

  <aside id="v3dPanel" hidden></aside></section>
<main class="wrap" id="main">

</main>

<div class="drawer" id="drawer" aria-hidden="true"><div class="ov" data-close></div>
  <aside class="pn" role="dialog" aria-modal="true" aria-labelledby="dTitle"><div id="dBody"></div></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STAGES=[["nouveau","Nouveau"],["contacte","Contacté"],["rdv","Échange / RDV"],["devis","Devis envoyé"],["gagne","Gagné"],["perdu","Perdu"]];
const SN=Object.fromEntries(STAGES);
const OFFRES=[["","—"],["Porte d'entrée",40000],["Lancement",100000],["Visibilité",250000],["Croissance (mensuel)",100000],["Service à l'unité",""]];
const SOURCES=["Avant / après (réseaux)","Terrain","Parrainage","Site YOKK","Réseaux YOKK","Atelier / événement","Autre"];
const SECTEURS=["Boutique / commerce","Électronique","Mode & cosmétiques","Restauration","Location meublée","Services","Autre"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F=n=>(n||n===0)&&n!==""?Number(n).toLocaleString("fr-FR").replace(/ | /g," ")+" F":"—";
const DAY=864e5, today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const ago=t=>{if(!t)return"";const s=(Date.now()-t)/1e3;if(s<60)return"à l'instant";if(s<3600)return`il y a ${Math.floor(s/60)} min`;if(s<86400)return`il y a ${Math.floor(s/3600)} h`;return new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})};
const dueInfo=d=>{if(!d)return["",""];const t=new Date(d+"T00:00").getTime(),t0=today0();if(t<t0)return["late","En retard · "+new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})];if(t===t0)return["today","Aujourd'hui"];return["",new Date(t).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})]};
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)};

let db=null,user=null,room=null,me=null,canWrite=true;
let P=[],T=[],A=[],peers=[],names={},view="tableau",openId=null,loaded={p:false,t:false,a:false};

/* ---------- noms et avatars ---------- */
async function resolveNames(){
  if(!user)return;
  const ids=new Set();P.forEach(p=>{p.assigne&&ids.add(p.assigne);p.creePar&&ids.add(p.creePar)});T.forEach(t=>t.assigne&&ids.add(t.assigne));A.forEach(a=>a.par&&ids.add(a.par));peers.forEach(x=>x.by&&ids.add(x.by));if(me)ids.add(me);
  if(!ids.size)return;names=await user.profiles([...ids]);render();
}
const nm=id=>id?(names[id]?.name||(id===me?"Vous":"Membre")):"Non assigné";
const av=id=>id&&names[id]?names[id].avatarUrl:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#8a9a93"/></svg>');
const avImg=(id,cls="")=>`<img class="${cls}" src="${esc(av(id))}" alt="">`;

/* ---------- présence en direct ---------- */
function setPresence(extra={}){if(!room)return;const p=openId?P.find(x=>x.id===openId):null;room.presence({view,rec:openId||null,recNom:p?(p.entreprise||p.nom||""):null,at:Date.now(),...extra}).catch(()=>{});}
const VIEWN={bureau:"le bureau 3D",tableau:"le tableau de bord",pipeline:"le pipeline",prospects:"la liste des prospects",taches:"les tâches",equipe:"la vue équipe"};
function doing(pr){if(!pr||!pr.view)return"Connecté";if(pr.rec&&pr.recNom)return`Sur la fiche « ${pr.recNom} »`;return"Consulte "+(VIEWN[pr.view]||"le CRM")}
function onlinePeers(){const by={};peers.forEach(x=>{if(!x.by)return;if(!by[x.by]||x.updatedAt>by[x.by].updatedAt)by[x.by]=x});return by}
function renderLive(){
  const on=Object.values(onlinePeers());
  $("stack").innerHTML=on.slice(0,5).map(x=>avImg(x.by)).join("");
  $("liveTxt").textContent=room?(on.length?`${on.length} en ligne`:"Personne en ligne"):"Direct indisponible";
}

/* ---------- journal d'activité ---------- */
async function log(type,texte,pid){if(!db||!me)return;try{await db.collection("activite").add({type,texte,par:me,le:Date.now(),pid:pid||null})}catch(e){}}

/* ---------- écritures ---------- */
async function guard(fn){try{await fn();return true}catch(e){if(e&&e.code==="invalid_argument"){canWrite=false;document.body.classList.add("ro");toast("Lecture seule : vous ne pouvez pas modifier ce CRM")}else if(e&&e.code==="quota_exceeded"){toast("La base est pleine : supprimez d'anciennes données")}else toast("Enregistrement impossible, réessayez");return false}}
async function saveProspect(id,data,isNew){
  const now=Date.now();
  if(isNew){const ref=db.collection("prospects").doc();const ok=await guard(()=>ref.set({...data,creePar:me,creeLe:now,majLe:now}));if(ok){log("creation",`a ajouté le prospect « ${data.entreprise||data.nom} »`,ref.id);toast("Prospect ajouté")}return ok?ref.id:null}
  const old=P.find(p=>p.id===id)||{};const ok=await guard(()=>db.doc("prospects/"+id).update({...data,majLe:now}));
  if(ok){const n=data.entreprise||data.nom||old.entreprise||old.nom;
    if(data.etape&&data.etape!==old.etape)log("etape",`a déplacé « ${n} » vers ${SN[data.etape]}`,id);
    else if(data.assigne!==undefined&&data.assigne!==old.assigne)log("assign",`a assigné « ${n} » à ${data.assigne?"{u:"+data.assigne+"}":"personne"}`,id);
    else log("maj",`a modifié la fiche « ${n} »`,id);toast("Enregistré")}
  return ok?id:null;
}

/* ---------- vues ---------- */
function kpis(){
  const act=P.filter(p=>!["gagne","perdu"].includes(p.etape));
  const pipe=act.reduce((s,p)=>s+(Number(p.montant)||0),0);
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
  const wonM=P.filter(p=>p.etape==="gagne"&&(p.gagneLe||p.majLe)>=m0.getTime());
  const ca=wonM.reduce((s,p)=>s+(Number(p.montant)||0),0);
  const closed=P.filter(p=>["gagne","perdu"].includes(p.etape));const won=closed.filter(p=>p.etape==="gagne").length;
  const late=T.filter(t=>t.statut!=="fait"&&t.echeance&&new Date(t.echeance+"T00:00").getTime()<today0()).length
    +P.filter(p=>!["gagne","perdu"].includes(p.etape)&&p.dateAction&&new Date(p.dateAction+"T00:00").getTime()<today0()).length;
  return `<div class="kpis">
   <div class="kpi"><small>Pipeline en cours</small><b class="num">${F(pipe)}</b><em>${act.length} prospect${act.length>1?"s":""} actif${act.length>1?"s":""}</em></div>
   <div class="kpi"><small>Signé ce mois</small><b class="num">${F(ca)}</b><em>${wonM.length} contrat${wonM.length>1?"s":""}</em></div>
   <div class="kpi"><small>Taux de conversion</small><b class="num">${closed.length?Math.round(won/closed.length*100)+" %":"—"}</b><em>${won} gagné${won>1?"s":""} sur ${closed.length} clôturé${closed.length>1?"s":""}</em></div>
   <div class="kpi ${late?"alert":""}"><small>Actions en retard</small><b class="num">${late}</b><em>tâches et relances</em></div>
  </div>`;
}
function funnel(){
  const max=Math.max(1,...STAGES.map(([k])=>P.filter(p=>p.etape===k).length));
  return `<div class="funnel">${STAGES.map(([k,l])=>{const ps=P.filter(p=>p.etape===k);const v=ps.reduce((s,p)=>s+(Number(p.montant)||0),0);
    return `<div class="fr"><span>${l} <b class="num">${ps.length}</b></span><div class="track"><div class="fill ${k==="gagne"?"won":k==="perdu"?"lost":""}" style="width:${ps.length/max*100}%"></div></div><span class="v num">${v?F(v):""}</span></div>`}).join("")}</div>`;
}
function feedHtml(list,limit=60){
  if(!list.length)return `<p class="empty">Aucune activité pour l'instant. Chaque ajout, déplacement ou tâche terminée apparaîtra ici en direct.</p>`;
  return `<ul class="feed">${list.slice(0,limit).map(a=>{let t=esc(a.texte).replace(/\{u:([^}]+)\}/g,(_,id)=>esc(nm(id)));
    if(a.pid&&P.some(p=>p.id===a.pid))t+=` · <a data-open="${esc(a.pid)}">ouvrir</a>`;
    return `<li>${avImg(a.par)}<div><b>${esc(nm(a.par))}</b> ${t}<time>${ago(a.le)}</time></div></li>`}).join("")}</ul>`;
}
function liveHtml(){
  const on=onlinePeers();const ids=Object.keys(on);
  if(!room)return `<p class="empty">Le suivi en direct n'est pas disponible dans cette vue.</p>`;
  if(!ids.length)return `<p class="empty">Personne n'est connecté en ce moment.</p>`;
  return `<div class="people">${ids.map(id=>{const x=on[id];const idle=Date.now()-x.updatedAt>5*60e3;
    return `<div class="person ${idle?"idle":""}">${avImg(id)}<div><b>${esc(nm(id))}${id===me?" (vous)":""}</b><span>${esc(doing(x.presence))}</span></div><span class="pill ${idle?"":"on"}">${idle?"Inactif":"En ligne"}</span></div>`}).join("")}</div>`;
}
function vTableau(){
  return `<h1>Tableau de bord</h1>${kpis()}
  <div class="grid2"><div><section class="panel"><h2>Pipeline par étape</h2>${funnel()}</section>
   <section class="panel"><h2>Prochaines actions</h2>${nextActions()}</section></div>
   <div><section class="panel"><h2>Équipe en direct</h2>${liveHtml()}</section>
   <section class="panel"><h2>Fil d'activité</h2>${feedHtml(A,40)}</section></div></div>`;
}
function nextActions(){
  const items=[...P.filter(p=>!["gagne","perdu"].includes(p.etape)&&p.dateAction).map(p=>({d:p.dateAction,t:p.prochaineAction||"Relancer",n:p.entreprise||p.nom,pid:p.id,who:p.assigne})),
    ...T.filter(t=>t.statut!=="fait"&&t.echeance).map(t=>({d:t.echeance,t:t.titre,n:(P.find(p=>p.id===t.pid)||{}).entreprise||"",pid:t.pid,who:t.assigne}))].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,8);
  if(!items.length)return `<p class="empty">Aucune action planifiée. Ajoutez une date de relance sur une fiche prospect.</p>`;
  return `<ul class="tl">${items.map(i=>{const[c,l]=dueInfo(i.d);return `<li><span></span><div><b>${esc(i.t)}</b><small>${esc(i.n)}</small></div><div class="r"><span class="due ${c}">${esc(l)}</span>${avImg(i.who)}</div></li>`}).join("")}</ul>`;
}
function card(p){const[c,l]=dueInfo(p.dateAction);
  return `<div class="card" draggable="${canWrite}" data-open="${esc(p.id)}" data-id="${esc(p.id)}"><b>${esc(p.entreprise||p.nom||"Sans nom")}</b>
  <div class="m"><span>${esc(p.offre||p.secteur||"")}</span><span class="num">${p.montant?F(p.montant):""}</span></div>
  <div class="m"><span class="due ${c}">${esc(l||p.prochaineAction||"")}</span>${avImg(p.assigne)}</div></div>`}
function vPipeline(){
  return `<h1>Pipeline</h1><p class="note">Glissez une carte d'une colonne à l'autre, ou ouvrez-la pour changer l'étape.</p>
  <div class="board">${STAGES.map(([k,l])=>{const ps=P.filter(p=>p.etape===k).sort((a,b)=>(b.majLe||0)-(a.majLe||0));const v=ps.reduce((s,p)=>s+(Number(p.montant)||0),0);
   return `<section class="col" data-stage="${k}"><h3>${l} <span class="num">${ps.length}${v?" · "+F(v):""}</span></h3>${ps.map(card).join("")||`<p class="empty">Vide</p>`}</section>`}).join("")}</div>`;
}
let fQ="",fE="",fA="";
function vProspects(){
  const ass=[...new Set(P.map(p=>p.assigne).filter(Boolean))];
  const q=fQ.toLowerCase();
  const list=P.filter(p=>(!fE||p.etape===fE)&&(!fA||(fA==="none"?!p.assigne:p.assigne===fA))&&(!q||[p.nom,p.entreprise,p.telephone,p.secteur,p.notes].join(" ").toLowerCase().includes(q))).sort((a,b)=>(b.majLe||0)-(a.majLe||0));
  return `<h1>Prospects <span class="num" style="color:var(--muted);font-size:15px">${list.length}</span></h1>
  <div class="tools"><input type="search" id="fQ" placeholder="Rechercher un nom, un numéro, une note…" value="${esc(fQ)}" aria-label="Rechercher">
   <select id="fE" aria-label="Étape"><option value="">Toutes les étapes</option>${STAGES.map(([k,l])=>`<option value="${k}" ${fE===k?"selected":""}>${l}</option>`).join("")}</select>
   <select id="fA" aria-label="Responsable"><option value="">Tous les responsables</option><option value="none" ${fA==="none"?"selected":""}>Non assigné</option>${ass.map(id=>`<option value="${esc(id)}" ${fA===id?"selected":""}>${esc(nm(id))}</option>`).join("")}</select></div>
  ${list.length?`<div class="tblw"><table><thead><tr><th>Entreprise</th><th>Contact</th><th>Étape</th><th>Offre</th><th>Montant</th><th>Prochaine action</th><th>Responsable</th><th>Mis à jour</th></tr></thead><tbody>
  ${list.map(p=>{const[c,l]=dueInfo(p.dateAction);return `<tr class="row" data-open="${esc(p.id)}"><td><b>${esc(p.entreprise||"—")}</b><br><small style="color:var(--muted)">${esc(p.secteur||"")}</small></td><td>${esc(p.nom||"")}<br><small class="num" style="color:var(--muted)">${esc(p.telephone||"")}</small></td>
   <td><span class="st st-${esc(p.etape)}">${esc(SN[p.etape]||p.etape)}</span></td><td>${esc(p.offre||"—")}</td><td class="num">${F(p.montant)}</td>
   <td>${esc(p.prochaineAction||"")}<br><span class="due ${c}">${esc(l)}</span></td><td><span class="who">${avImg(p.assigne)}${esc(nm(p.assigne))}</span></td><td style="color:var(--muted)">${ago(p.majLe)}</td></tr>`}).join("")}
  </tbody></table></div>`:`<p class="empty">${P.length?"Aucun prospect ne correspond à ces filtres.":"Aucun prospect pour l'instant. Cliquez sur « + Prospect » pour ajouter le premier."}</p>`}`;
}
function vTaches(){
  const t0=today0();const open=T.filter(t=>t.statut!=="fait");
  const g=[["En retard",open.filter(t=>t.echeance&&new Date(t.echeance+"T00:00").getTime()<t0)],["Aujourd'hui",open.filter(t=>t.echeance&&new Date(t.echeance+"T00:00").getTime()===t0)],
    ["À venir",open.filter(t=>!t.echeance||new Date(t.echeance+"T00:00").getTime()>t0)],["Terminées",T.filter(t=>t.statut==="fait").sort((a,b)=>(b.faitLe||0)-(a.faitLe||0)).slice(0,20)]];
  return `<h1>Tâches</h1>
  <form class="panel wr" id="tForm" style="margin-bottom:16px"><div class="form">
   <label class="full">Nouvelle tâche<input type="text" id="tTitre" required placeholder="Ex. Envoyer 10 avant / après sur Instagram"></label>
   <label>Prospect lié<select id="tPid"><option value="">Aucun</option>${P.filter(p=>p.etape!=="perdu").map(p=>`<option value="${esc(p.id)}">${esc(p.entreprise||p.nom)}</option>`).join("")}</select></label>
   <label>Échéance<input type="date" id="tDate"></label>
   <label class="full">Responsable<div id="tAssign"></div></label></div>
   <div class="acts"><button class="btn pri" type="submit">Ajouter la tâche</button></div></form>
  <div class="tasks">${g.map(([l,ts])=>`<section class="panel"><h2>${l} <span class="num" style="color:var(--muted)">${ts.length}</span></h2>${ts.length?`<ul class="tl">${ts.map(t=>{const[c,lb]=dueInfo(t.echeance);const p=P.find(x=>x.id===t.pid);

  for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const len=Math.hypot(b[0]-a[0],b[1]-a[1]);const s=box(len+.25,.05,.25,gm,(a[0]+b[0])/2,.04,(a[1]+b[1])/2,{cast:false});s.rotation.y=-Math.atan2(b[1]-a[1],b[0]-a[0])}

function pathAt(u){const p=T3.path;const segs=[];let tot=0;for(let i=0;i<p.length-1;i++){const l=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);segs.push(l);tot+=l}

  Object.entries(Z3).forEach(([k,z])=>{const ps=P.filter(p=>p.etape===k);const v=ps.reduce((s,p)=>s+(Number(p.montant)||0),0);
    place(label("z:"+k,`<b>${esc(z.t)}</b><span class="num">${ps.length}${v?" · "+F(v):""}</span>`,"zone"),new THREE.Vector3(z.x,.2,z.z>0?z.z-z.d/2+1.2:z.z+z.d/2-.6))});
  place(label("z:studio",`<b>${esc(STUDIO.t)}</b><span>${Object.keys(onlinePeers()).length} en ligne</span>`,"zone"),new THREE.Vector3(STUDIO.x-5.5,.2,STUDIO.z-STUDIO.d/2+1.2));
  const open=T.filter(t=>t.statut!=="fait");
  place(label("tasks",`<b>Tâches</b><span>${open.length} ouverte${open.length>1?"s":""}</span>`,"zone"),new THREE.Vector3(7.5,2.6,5.5));
  const many=Object.keys(T3.blocks).length>24;
  Object.values(T3.blocks).forEach(b=>{const p=b.p;const s=sel3&&sel3.kind==="p"&&sel3.id===p.id;
    if(many&&!s)return;place(label("p:"+p.id,esc(p.entreprise||p.nom||"?"),"shop"+(s?" sel":"")),new THREE.Vector3(b.g.position.x,b.g.position.y+b.h+.35,b.g.position.z))});
  T3.people.forEach(p=>{place(label("u:"+p.id,`<img src="${esc(av(p.id))}" alt=""><span><b>${esc(nm(p.id))}</b><em>${p.online?esc(doing(p.presence)):"Hors ligne"}</em></span>`,"person"+(p.online?" on":"")),new THREE.Vector3(p.g.position.x,2.15,p.g.position.z))});
  Object.entries(T3.labels).forEach(([k,l])=>{if(!l._used)l.style.display="none"});
}
function kpi3d(){
  const act=P.filter(p=>!["gagne","perdu"].includes(p.etape));const pipe=act.reduce((s,p)=>s+(Number(p.montant)||0),0);
  const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const ca=P.filter(p=>p.etape==="gagne"&&(p.gagneLe||p.majLe)>=m0.getTime()).reduce((s,p)=>s+(Number(p.montant)||0),0);
  const closed=P.filter(p=>["gagne","perdu"].includes(p.etape));const won=closed.filter(p=>p.etape==="gagne").length;
  $("v3dKpi").innerHTML=`<div><small>Pipeline en cours</small><b class="num">${F(pipe)}</b></div><div><small>Signé ce mois</small><b class="num">${F(ca)}</b></div><div><small>Conversion</small><b class="num">${closed.length?Math.round(won/closed.length*100)+" %":"—"}</b></div><div><small>En ligne</small><b class="num">${Object.keys(onlinePeers()).length}</b></div>`;
}

/* --- panneau de détail --- */
function panel3d(){
  const el=$("v3dPanel");if(!el)return;
  if(!sel3){el.hidden=true;return}el.hidden=false;let h="";
  if(sel3.kind==="p"){const p=P.find(x=>x.id===sel3.id);if(!p){sel3=null;el.hidden=true;return}const[c,l]=dueInfo(p.dateAction);
    h=`<div class="ph"><span class="st st-${esc(p.etape)}">${esc(SN[p.etape])}</span><button class="btn sm ghost" data-x3 aria-label="Fermer">✕</button></div>
    <h2>${esc(p.entreprise||p.nom)}</h2><p class="muted">${esc([p.nom,p.secteur].filter(Boolean).join(" · "))}</p>
    <dl class="kv"><div><dt>Offre</dt><dd>${esc(p.offre||"—")}</dd></div><div><dt>Montant</dt><dd class="num">${F(p.montant)}</dd></div>
    <div><dt>WhatsApp</dt><dd class="num">${esc(p.telephone||"—")}</dd></div><div><dt>Responsable</dt><dd><span class="who">${avImg(p.assigne)}${esc(nm(p.assigne))}</span></dd></div>
    <div class="full"><dt>Prochaine action</dt><dd>${esc(p.prochaineAction||"—")} <span class="due ${c}">${esc(l)}</span></dd></div></dl>
    ${p.notes?`<p class="notes">${esc(p.notes)}</p>`:""}
    <div class="wr"><p class="muted" style="margin:12px 0 6px">Déplacer vers</p><div class="mv">${STAGES.filter(([k])=>k!==p.etape).map(([k,l])=>`<button class="btn sm" data-mv="${k}">${l}</button>`).join("")}</div></div>
    <div class="acts"><button class="btn pri" data-open="${esc(p.id)}">Ouvrir la fiche</button></div>
    <h3>Historique</h3>${feedHtml(A.filter(a=>a.pid===p.id),12)}`}
  else if(sel3.kind==="zone"){const z=Z3[sel3.id];
    if(!z){h=`<div class="ph"><b>${esc(STUDIO.t)}</b><button class="btn sm ghost" data-x3 aria-label="Fermer">✕</button></div>${liveHtml()}`}
    else{const ps=P.filter(p=>p.etape===sel3.id);h=`<div class="ph"><b>${esc(z.t)}</b><button class="btn sm ghost" data-x3 aria-label="Fermer">✕</button></div>
      <p class="muted">${ps.length} prospect${ps.length>1?"s":""} · ${F(ps.reduce((s,p)=>s+(Number(p.montant)||0),0))}</p>
      ${ps.length?`<div class="zl">${ps.map(p=>`<button data-sel="${esc(p.id)}"><b>${esc(p.entreprise||p.nom)}</b><span class="num">${p.montant?F(p.montant):esc(p.offre||"")}</span></button>`).join("")}</div>`:`<p class="empty">Aucun prospect à cette étape.</p>`}`}}
  else if(sel3.kind==="person"){const id=sel3.id;const x=onlinePeers()[id];const mine=P.filter(p=>p.assigne===id);const won=mine.filter(p=>p.etape==="gagne");const acts=A.filter(a=>a.par===id);
    h=`<div class="ph"><span class="who">${avImg(id)}<b>${esc(nm(id))}${id===me?" (vous)":""}</b></span><button class="btn sm ghost" data-x3 aria-label="Fermer">✕</button></div>
    <p class="muted">${x?esc(doing(x.presence)):"Hors ligne"}</p>
    <dl class="kv"><div><dt>Prospects suivis</dt><dd class="num">${mine.filter(p=>p.etape!=="perdu").length}</dd></div><div><dt>Actions aujourd'hui</dt><dd class="num">${acts.filter(a=>a.le>=today0()).length}</dd></div>
    <div><dt>Contrats gagnés</dt><dd class="num">${won.length}</dd></div><div><dt>CA signé</dt><dd class="num">${F(won.reduce((s,p)=>s+(Number(p.montant)||0),0))}</dd></div></dl>
    <h3>Ses dernières actions</h3>${feedHtml(acts,15)}`}
  else if(sel3.kind==="tasks"){const open=T.filter(t=>t.statut!=="fait").sort((a,b)=>(a.echeance||"9").localeCompare(b.echeance||"9"));
    h=`<div class="ph"><b>Tâches ouvertes</b><button class="btn sm ghost" data-x3 aria-label="Fermer">✕</button></div>
    ${open.length?`<ul class="tl">${open.map(t=>{const[c,l]=dueInfo(t.echeance);return `<li><input type="checkbox" data-tdone="${esc(t.id)}" ${canWrite?"":"disabled"} aria-label="Terminer"><div><b>${esc(t.titre)}</b><small class="due ${c}">${esc(l)}</small></div>${avImg(t.assigne)}</li>`}).join("")}</ul>`:`<p class="empty">Aucune tâche ouverte.</p>`}
    <div class="acts"><a class="btn" href="#taches">Gérer les tâches</a></div>`}
  el.innerHTML=h;
}
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-x3]")){sel3=null;openId=null;panel3d();setPresence();focus3d(-.5,-.6,1);return}
  const s=e.target.closest("[data-sel]");if(s){sel3={kind:"p",id:s.dataset.sel};const b=T3&&T3.blocks[s.dataset.sel];if(b)focus3d(b.g.position.x,b.g.position.z,1.8);openId=s.dataset.sel;setPresence();panel3d();return}
  const mv=e.target.closest("[data-mv]");if(mv&&sel3&&sel3.kind==="p"){const data={etape:mv.dataset.mv};if(mv.dataset.mv==="gagne")data.gagneLe=Date.now();await saveProspect(sel3.id,data,false)}
  if(e.target.closest("[data-reset3]")){sel3=null;panel3d();T3.theta=-.78;T3.phi=.92;focus3d(-.5,-.6,1)}
});

/* --- boucle d'animation --- */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop3d(){
  if(!T3||view!=="bureau"){if(T3)T3.raf=0;return}
  T3.raf=requestAnimationFrame(loop3d);
  const t=(performance.now()-T3.t0)/1e3;
  if(T3.goal){const g=T3.goal,k=.12;T3.target.x+=(g.x-T3.target.x)*k;T3.target.z+=(g.z-T3.target.z)*k;T3.zoom+=(g.zoom-T3.zoom)*k;if(Math.abs(g.zoom-T3.zoom)<.005&&Math.abs(g.x-T3.target.x)<.01)T3.goal=null;placeCam()}
  Object.values(T3.blocks).forEach(b=>{const p=b.g.position;p.x+=(b.tx-p.x)*.1;p.z+=(b.tz-p.z)*.1;p.y+=(b.ty-p.y)*.14;
    const s=sel3&&sel3.kind==="p"&&sel3.id===b.p.id;b.body.material.emissive.set(s?"#e3b862":"#000000");b.body.material.emissiveIntensity=s?.6:0;b.g.scale.setScalar(s?1.15:1);
    if(b.beacon.visible)b.beacon.material.emissiveIntensity=RM?1:.5+.5*Math.sin(t*5)});
  const now=performance.now(),dt=Math.min(.05,(now-T3.last)/1e3);T3.last=now;
  Object.values(T3.agents).forEach(a=>stepAgent(a,dt,t));T3.walkers.forEach(w=>walkerTick(w,dt,t));
  if(!RM){T3.flow.forEach(f=>{const u=(f.o+t*.05)%1;const[x,z]=pathAt(u);f.m.position.x=x;f.m.position.z=z})}
  T3.pins.forEach(pin=>{const b=T3.blocks[pin.userData.on];if(!b)return;pin.position.set(b.g.position.x+pin.userData.off-.2,b.g.position.y+b.h+.9+(RM?0:Math.sin(t*3)*.12),b.g.position.z)});
  T3.pulses=T3.pulses.filter(p=>{p.t+=.016;const s=1+p.t*4;p.r.scale.set(s,s,s);p.r.material.opacity=Math.max(0,.9-p.t);if(p.t>1){T3.scene.remove(p.r);return false}return true});
  T3.renderer.render(T3.scene,T3.cam);labels3d();
}
function show3d(){
  if(!window.THREE){$("v3dCanvas").innerHTML=`<p class="empty">La vue 3D n'a pas pu se charger. Les autres onglets fonctionnent normalement.</p>`;return}
  if(!init3d())return;resize3d();sync3d();if(!T3.raf)loop3d();
}

/* ---------- démarrage ---------- */
route();
(async()=>{
  if(!window.claude||!window.claude.use){render();return}
  [db,user,room]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("room")]);
  if(user){me=await user.id();const cw=await user.can("data.write");if(cw===false){canWrite=false;document.body.classList.add("ro")}}
  if(!db){render();return}
  const timer=setTimeout(()=>{if(!loaded.p)$("main").innerHTML=`<p class="note">Les données mettent du temps à arriver. Vérifiez votre connexion : la page se mettra à jour toute seule.</p>`},10e3);
  const err=()=>{clearTimeout(timer);toast("Connexion aux données perdue. Rechargez la page.")};
  db.collection("prospects").onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)clearTimeout(timer);loaded.p=true;render();resolveNames()},err);
  db.collection("taches").onSnapshot(s=>{T=s.docs.map(d=>({id:d.id,...d.data()}));loaded.t=true;render();resolveNames()},err);
  db.collection("activite").orderBy("le","desc").limit(400).onSnapshot(s=>{A=s.docs.map(d=>({id:d.id,...d.data()}));loaded.a=true;render();resolveNames()},err);
  if(room){peers=room.peers();room.onPeers(ch=>{peers=ch.peers;renderLive();if(["tableau","equipe","bureau"].includes(view))render();resolveNames()});setPresence()}
  render();
})();
</script>
