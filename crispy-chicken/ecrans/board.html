<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Brush;src:url(fonts/KaushanScript.woff2) format("woff2")}
@font-face{font-family:Cond;src:url(fonts/Anton.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#141414;color:#fff;font-family:Cond,Impact,sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,#262019 0%,#161412 55%,#0c0c0c 100%)}
.brick{position:absolute;inset:0;opacity:.10;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='120'><g fill='none' stroke='%23000' stroke-width='5'><path d='M0 2.5H240M0 62.5H240M2.5 0V60M122.5 0V60M62.5 60V120M182.5 60V120'/></g></svg>")}
.frame{position:absolute;inset:14px;border:2px solid #F5B40055;border-radius:14px}
.logo{position:absolute;right:34px;top:26px;width:104px;height:104px;z-index:5}
.halal{position:absolute;right:150px;top:56px;font-size:22px;letter-spacing:.18em;color:#F5B400;border:2px solid #F5B400;border-radius:999px;padding:6px 16px}
.zone{position:absolute}
.ttl{font-family:Brush;font-size:58px;line-height:1;white-space:nowrap}
.ttl em{font-style:normal;color:#E8382C}
.sub{font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#ffffffb8;margin-top:6px}
.bar{height:4px;width:150px;border-radius:2px;background:linear-gradient(90deg,#E0281E,#F5B400);margin-top:8px}
.grid{display:grid;gap:10px;margin-top:14px}
.card{background:linear-gradient(180deg,#ffffff0d,#ffffff05);border:1px solid #ffffff14;border-radius:14px;padding:8px 10px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.card .ph{width:100%;position:relative;overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px #000c)}
.card .nm{font-size:23px;line-height:1.02;text-transform:uppercase;margin-top:6px}
.card .ds{font-family:Arial,sans-serif;font-weight:700;font-size:11.5px;line-height:1.25;color:#ffffffa8;text-transform:uppercase;margin-top:4px}
.card .star{position:absolute;top:6px;left:8px;z-index:2;font-size:12px;letter-spacing:.12em;background:#F5B400;color:#140f05;padding:2px 7px;border-radius:4px}
.tag{display:inline-flex;align-items:flex-start;background:linear-gradient(180deg,#F2402F,#C3170E);color:#fff;padding:3px 9px 2px;border-radius:5px;line-height:1;margin-top:6px;box-shadow:0 4px 10px #0008}
.tag b{font-weight:400;font-size:28px}.tag i{font-style:normal;font-size:18px;margin:2px 1px 0}.tag sup{font-size:16px;margin-top:2px}
.list .row{display:flex;align-items:center;gap:10px;border-bottom:2px dashed #ffffff1a;padding:6px 0}
.list .row img{width:40px;height:40px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 6px #000a)}
.list .row .n{font-size:23px;text-transform:uppercase;line-height:1.05}
.list .row .q{font-family:Arial,sans-serif;font-weight:700;font-size:11px;color:#ffffff90;text-transform:uppercase;display:block;margin-top:2px}
.list .row .sp{flex:1}
.list .row .tag{margin-top:0}.list .row .tag b{font-size:24px}.list .row .tag i{font-size:15px}.list .row .tag sup{font-size:14px}
.foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:18px;letter-spacing:.2em;color:#ffffff70}

.tag{position:relative;overflow:hidden}
.tag::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:var(--sh,-60%);background:linear-gradient(100deg,transparent,#ffffff70,transparent);transform:skewX(-20deg)}
.card .glow{position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 2px #F5B400,0 0 26px #F5B40066;opacity:0;pointer-events:none}
.emb{position:absolute;inset:0;pointer-events:none;z-index:4}.emb i{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;background:#FFD84D;box-shadow:0 0 10px 3px #F5B40088}
.logo{transform-origin:50% 50%}
</style></head><body>
<div class="bg"><div class="brick"></div></div><div class="frame"></div>
<img class="logo" src="../site/img/icone.svg" alt="">
<div id="root"></div>
<script src="../site/menu.js"></script>
<script>
const M = window.CC_MENU, cat = id => M.find(c => c.id === id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tag = p => { const [e, c] = p.toFixed(2).split("."); return `<span class="tag"><b>${e}</b><i>€</i><sup>${c}</sup></span>`; };
const short = d => (d || "").replace(/\.$/, "");
const img = it => it.img ? `../site/img/p/${it.img}.webp` : "";
const T = (a, b, sub) => `<div class="ttl">${a}${b ? ` <em>${b}</em>` : ""}</div>${sub ? `<div class="sub">${sub}</div>` : ""}<div class="bar"></div>`;
const CARDS = (items, cols, ph, o = {}) => `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${items.map(it => `<div class="card">${it.star ? `<span class="star">SIGNATURE</span>` : ""}<div class="ph" style="height:${ph}px">${img(it) ? `<img src="${img(it)}" alt="">` : ""}</div><div class="nm">${esc(it.n)}</div>${o.nod || !it.d ? "" : `<div class="ds">${esc(short(it.d))}</div>`}${tag(it.p)}</div>`).join("")}</div>`;
const LIST = (items, o = {}) => `<div class="list" style="margin-top:10px">${items.map(it => `<div class="row">${o.img && img(it) ? `<img src="${img(it)}" alt="">` : ""}<span><span class="n" style="${o.fs ? `font-size:${o.fs}px` : ""}">${esc(it.n)}</span>${o.q && it.d ? `<span class="q">${esc(short(it.d))}</span>` : ""}</span><span class="sp"></span>${tag(it.p)}</div>`).join("")}</div>`;
const Z = (x, y, w, h) => `<div class="zone" style="left:${x}px;top:${y}px;width:${w}px${h ? `;height:${h}px` : ""}">`;
const KEY = new URLSearchParams(location.search).get("s") || "naans";
let html = "";
if (KEY === "naans") {
  html += Z(40, 30, 1220) + T("Nos Naans", "Spéciaux", "Pain naan cuit au tandoor · cheddar fondant · sauce au choix") + CARDS(cat("naans").items, 5, 210) + "</div>";
  html += Z(1290, 150, 590) + T("Nos", "Formules", "Boisson comprise dans tous nos menus") + CARDS(cat("formules").items, 2, 140) + "</div>";
  html += Z(1290, 790, 285) + T("Desserts", "") + LIST(cat("desserts").items, { fs: 16 }) + "</div>";
  html += Z(1600, 790, 280) + T("Boissons", "") + LIST(cat("boissons").items, { fs: 16 }) + "</div>";
} else {
  html += Z(40, 30, 1150) + T("Nos", "Burgers") + CARDS(cat("burgers").items, 5, 150, { nod: 1 }) + "</div>";
  html += Z(40, 368, 1150) + T("Nos", "Wraps") + CARDS(cat("wraps").items, 3, 150, { nod: 1 }) + "</div>";
  html += Z(40, 706, 1150) + T("Crousti", "", "Riz thaï parfumé · poulet croustillant · sauce maison") + CARDS(cat("crousty").items, 5, 140, { nod: 1 }) + "</div>";
  html += Z(1220, 150, 330) + T("Wings", "Tenders") + LIST(cat("wings").items, { img: 1, fs: 20 }) + "</div>";
  html += Z(1580, 150, 310) + T("Family", "Packs") + LIST(cat("family").items, { img: 1, fs: 17, q: 1 }) + "</div>";
  html += Z(1220, 640, 670) + T("Accompagnements", "") + LIST(cat("sides").items, { fs: 19 }) + "</div>";
}
document.getElementById("root").innerHTML = html;

/* animations douces, périodiques (boucle parfaite de LOOP secondes) */
const LOOP = 20; window.DURATION = LOOP;
const TAU = Math.PI * 2, w = t => TAU * t / LOOP;
const cards = [...document.querySelectorAll(".card")], imgs = cards.map(c => c.querySelector(".ph img")), tags = [...document.querySelectorAll(".tag")];
cards.forEach(c => { const g = document.createElement("div"); g.className = "glow"; c.appendChild(g); });
const rows = [...document.querySelectorAll(".list .row img")];
const emb = document.createElement("div"); emb.className = "emb"; document.body.appendChild(emb);
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const E = [...Array(28)].map((_, i) => { const e = document.createElement("i"); emb.appendChild(e); return { e, x: R(i) * 1920, k: 1 + Math.floor(R(i + 50) * 2), ph: R(i + 99), s: .5 + R(i + 7) * .8 }; });
const logo = document.querySelector(".logo");
window.render = t => {
  t = ((t % LOOP) + LOOP) % LOOP; const a = w(t);
  imgs.forEach((im, i) => { if (!im) return; const p = i * 0.9; im.style.transform = `translateY(${Math.sin(a * 2 + p) * 5}px) rotate(${Math.sin(a + p) * 1.2}deg) scale(${1 + Math.sin(a * 2 + p + 1) * 0.015})`; });
  rows.forEach((im, i) => { im.style.transform = `translateY(${Math.sin(a * 2 + i) * 3}px) rotate(${Math.sin(a + i) * 3}deg)`; });
  /* un produit mis en lumière à tour de rôle : chaque carte une fois par boucle */
  const n = cards.length, slot = LOOP / n;
  cards.forEach((c, i) => { const u = (t - i * slot + LOOP) % LOOP, on = u < slot * 1.6 ? Math.sin(Math.PI * u / (slot * 1.6)) : 0; c.querySelector(".glow").style.opacity = on * 0.9; c.style.transform = `scale(${1 + on * 0.025})`; });
  tags.forEach((g, i) => { const ph = ((t / LOOP) * 4 + i * 0.137) % 1; g.style.setProperty("--sh", (-60 + ph * 260) + "%"); });
  E.forEach(m => { const ph = ((t / LOOP) * m.k + m.ph) % 1, y = 1080 - ph * 1200; m.e.style.transform = `translate(${m.x + Math.sin(a * 2 + m.ph * 9) * 25}px,${y}px) scale(${m.s})`; m.e.style.opacity = Math.sin(ph * Math.PI) * .5; });
  logo.style.transform = `rotate(${Math.sin(a) * 4}deg) scale(${1 + Math.sin(a * 2) * 0.03})`;
};
window.render(0);
window.READY = true;
</script></body></html>
