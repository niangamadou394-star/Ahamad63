<style>
/* Layout : en-tête collant avec onglets ; contenu en grilles qui passent en une colonne sur téléphone */
:root{
  --bg:#f6f1e9; --surface:#fffdf9; --surface2:#efe7da; --line:#e2d6c4; --fg:#2b2118; --muted:#76685a;
  --accent:#8a5f36; --accent-fg:#fffdf9; --gold:#b08a57; --gold-soft:#f1e3cb;

  --r:12px; --shadow:0 1px 2px #2b21180d,0 8px 24px #2b211812;
}
*{box-sizing:border-box}
html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.18em}
.brand small{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
nav.tabs a.on{color:var(--fg);border-color:var(--gold)}
main{padding-block:22px 70px}
h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.row>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.occ{display:grid;gap:14px}
.occ .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--gold);border-radius:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.list li:last-child{border-bottom:0}
.list small{display:block;color:var(--muted);font-size:12px}
.list .r{text-align:right;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:13.5px}

.p-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.p-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.p-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.p-gold{background:var(--gold-soft);color:var(--accent)}

.calw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal{display:grid;gap:3px;min-width:860px}
.cal .h{font-size:11px;color:var(--muted);text-align:center}
.cal .h.we{color:var(--gold)}
.cal .apt{font-family:var(--serif);font-weight:600;font-size:16px;align-self:center;padding-right:8px;white-space:nowrap}
.cal .d{height:44px;border-radius:5px;background:var(--surface2)}
.cal .d.today{outline:1.5px solid var(--gold)}
.cal .bk{height:44px;border-radius:7px;padding:4px 7px;font-size:11.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#fff}
.bk.s-Demande{background:#a38d6f}.bk.s-Confirmée{background:#3c6a96}.bk.s-Payée{background:#2f7a4b}

/* tableaux */
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
tr.r{cursor:pointer}tr.r:hover td{background:var(--surface2)}

.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:160px}
.col h3{display:flex;justify-content:space-between;font-family:var(--serif);font-size:17px;margin:2px 4px 10px}
.col h3 span{font-family:var(--body);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{display:block}
.card small{color:var(--muted);font-size:12px}
.due{font-size:12px;font-weight:600}.due.late{color:var(--bad)}.due.today{color:var(--warn)}

.scents{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.sc b{display:block;font-family:var(--serif);font-size:20px}
.sc small{color:var(--muted);font-size:11.5px}
.sc .n{font-family:var(--serif);font-size:26px;margin-top:4px}
/* formulaire */
.drawer{position:fixed;inset:0;z-index:20;display:none}
.drawer.open{display:block}
.drawer .ov{position:absolute;inset:0;background:#0007}
.drawer .pn{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.qty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qty label{text-align:center}
.calc{font-size:13px;background:var(--gold-soft);border-radius:9px;padding:8px 10px;color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:12.5px}
.feed{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.feed li{padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.feed time{display:block;color:var(--muted);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
#r3{position:relative;height:calc(100vh - 118px);min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface),var(--bg) 75%);border-bottom:1px solid var(--line)}
#r3c{position:absolute;inset:0}#r3c canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#r3l{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.l3.apt{display:grid;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;box-shadow:var(--shadow)}
.l3.apt b{font-family:var(--serif);font-size:19px;font-weight:600}.l3.apt span{font-size:12px;color:var(--muted)}.l3.apt em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600}
.l3.apt.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),var(--shadow)}
.l3.bt3{font-family:var(--serif);font-size:14px;font-weight:600;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:6px;padding:0 6px}
.l3.bt3 span{font-family:var(--body);font-size:11px;color:var(--accent)}
#r3top{position:absolute;top:14px;left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 28px)}
#r3top .k3{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px;box-shadow:var(--shadow)}
#r3top small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}#r3top b{font-family:var(--serif);font-size:20px}
#r3tools{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#r3tools span{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#r3p{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.ph3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph3 b{font-family:var(--serif);font-size:22px}
.kv3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kv3 div{background:var(--surface2);border-radius:10px;padding:8px 10px}.kv3 small{display:block;font-size:11px;color:var(--muted)}.kv3 b{font-size:14px}
#r3p h3{font-family:var(--serif);font-size:17px;margin:6px 0}
@media (max-width:700px){#r3p{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;max-height:55%}#r3top .k3:nth-child(n+3){display:none}#r3tools span{display:none}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.scents{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.sp .btn:not(.pri){display:none}.l3.apt span,.l3.apt em{display:none}.l3.apt{padding:4px 10px}.l3.apt b{font-size:16px}.form{grid-template-columns:1fr}.scents{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#login{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,var(--surface),var(--bg) 70%);display:grid;place-items:center;padding:20px}
#login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:12px;box-shadow:var(--shadow);text-align:center}
#login .lb{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.3em;padding-left:.3em}
#login small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
#login label{display:grid;gap:4px;text-align:left;font-size:12px;font-weight:600;color:var(--muted)}
#login .btn{justify-content:center;margin-top:6px}
</style>

<script>
/* Adaptateur : stockage dans Google Sheets via Apps Script (gratuit) */
(() => {
  const L = {}, cache = { reservations: [], contacts: [], commandes: [], activite: [] }; let ver = -1, started = false;
  const get = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const who = () => get("tinado-nom") || "Équipe", code = () => get("tinado-code");
  const api = async body => { const r = await fetch(window.TINADO_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, code: code() }) }); const j = await r.json(); if (j.error === "auth") { showLogin(); throw { code: "unavailable" }; } if (j.error) throw { code: "invalid_argument" }; return j; };
  const snap = c => ({ docs: cache[c].map(d => { const { id, ...rest } = d; return { id, exists: true, data: () => rest }; }), size: cache[c].length, empty: !cache[c].length, metadata: { fromCache: false, hasPendingWrites: false } });
  const emit = () => Object.entries(L).forEach(([c, fs]) => fs.forEach(f => f(snap(c))));
  async function pull(force) { try { if (!force) { const { v } = await api({ action: "version" }); if (v === ver) return; } const j = await api({ action: "all" }); ver = j.v; Object.assign(cache, j.data); emit(); } catch (e) {} }
  const start = () => { if (started) return; started = true; if (!code()) return showLogin(); pull(true); setInterval(pull, 15000); document.addEventListener("visibilitychange", () => !document.hidden && pull()); };
  const write = async (action, col, id, data) => { const i = cache[col].findIndex(d => d.id === id);
    if (action === "put") { if (i >= 0) cache[col][i] = { id, ...data }; else cache[col].push({ id, ...data }); } else if (i >= 0) cache[col].splice(i, 1);
    emit(); await api({ action, col, id, data }); ver = -1; };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docRef = (col, id) => ({ id, path: col + "/" + id, set: d => write("put", col, id, d),
    update: d => { const cur = cache[col].find(x => x.id === id) || {}; const { id: _, ...rest } = cur; return write("put", col, id, { ...rest, ...d }); }, delete: () => write("del", col, id) });
  const collection = c => { const q = { orderBy() { return q; }, limit() { return q; }, where() { return q; },
    onSnapshot(next) { (L[c] = L[c] || []).push(next); start(); if (ver >= 0) setTimeout(() => next(snap(c)), 0); return () => { L[c] = L[c].filter(f => f !== next); }; },
    get: async () => snap(c), doc: id => docRef(c, id || newId()), add: async d => { const id = newId(); await write("put", c, id, d); return docRef(c, id); } }; return q; };
  window.claude = { use: async n => ({ db: { collection, doc: p => { const [c, id] = p.split("/"); return docRef(c, id); } },
    user: { id: async () => who(), can: async () => true, profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: i }])) } })[n] || null };
  function showLogin() {
    if (document.getElementById("login")) return;
    const d = document.createElement("div"); d.id = "login";
    d.innerHTML = `<form id="lf"><div class="lb">TINADO</div><small>Maison · Dakar · Gestion</small>
      <label>Votre prénom<input id="ln" required autocomplete="given-name"></label>
      <label>Code d'accès<input id="lc" type="password" required autocomplete="current-password"></label>
      <button class="btn pri" type="submit">Entrer</button><p id="le" class="err" hidden></p></form>`;
    document.body.appendChild(d); document.getElementById("ln").value = who() === "Équipe" ? "" : who();
    document.getElementById("lf").onsubmit = async e => { e.preventDefault(); const c = document.getElementById("lc").value, p = document.getElementById("le");
      let j; try { const r = await fetch(window.TINADO_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "login", code: c }) }); j = await r.json();
        if (!j.ok) { p.hidden = false; p.textContent = "Code incorrect."; return; } } catch (x) { p.hidden = false; p.textContent = "Serveur injoignable : vérifiez que le déploiement Apps Script est en accès « Tout le monde »."; return; }
        if (j.error === "server") { p.hidden = false; p.textContent = "Erreur du serveur Google : " + (j.message || ""); return; }
      try { localStorage.setItem("tinado-code", c); localStorage.setItem("tinado-nom", document.getElementById("ln").value.trim() || "Équipe"); } catch (x) {}
      location.reload(); };
  }
})();
</script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const F = n => (n || n === 0) && n !== "" && !isNaN(n) ? Math.round(Number(n)).toLocaleString("fr-FR").replace(/ | /g, " ") + " F" : "—";
const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); };
const D = s => new Date(s + "T00:00");

const APTS = [{ id: "f3", nom: "F3 · Point E", court: "F3", nuit: 65000, mois: 1000000 }, { id: "cs", nom: "Chambre-salon", court: "Chambre-salon", nuit: 45000, mois: 850000 }];

/* ---------- calculs ---------- */
const monthDays = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const active = r => r.statut !== "Annulée";
function nightsInMonth(r, m) { // nuits de la réservation qui tombent dans le mois m
  const [y, mo] = m.split("-").map(Number); const s = new Date(y, mo - 1, 1), e = new Date(y, mo, 1);
  const a = Math.max(D(r.arrivee), s), b = Math.min(D(r.depart), e); return Math.max(0, Math.round((b - a) / 864e5));
}
const revInMonth = (r, m) => { const n = nights(r.arrivee, r.depart); return n ? (Number(r.prix) || 0) * nightsInMonth(r, m) / n : 0; };
function stats(m) {
  const days = monthDays(m), act = R.filter(active);
  const per = APTS.map(a => { const rs = act.filter(r => r.apt === a.id); const n = rs.reduce((s, r) => s + nightsInMonth(r, m), 0); return { ...a, nuits: n, occ: Math.min(1, n / days), ca: rs.reduce((s, r) => s + revInMonth(r, m), 0) }; });
  const ca = per.reduce((s, a) => s + a.ca, 0), nu = per.reduce((s, a) => s + a.nuits, 0);
  const [y, mo] = m.split("-").map(Number); const s0 = new Date(y, mo - 1, 1).getTime(), e0 = new Date(y, mo, 1).getTime();
  const cmds = O.filter(o => o.date && D(o.date).getTime() >= s0 && D(o.date).getTime() < e0);
  return { per, ca, nu, occ: nu / (days * APTS.length), sca: cmds.reduce((s, o) => s + (Number(o.montant) || 0), 0), sn: cmds.reduce((s, o) => s + Object.values(o.qte || {}).reduce((a, b) => a + (Number(b) || 0), 0), 0) };
}
function overlap(r, skipId) { return R.find(x => x.id !== skipId && active(x) && x.apt === r.apt && D(x.arrivee) < D(r.depart) && D(r.arrivee) < D(x.depart)); }

async function guard(fn) { try { await fn(); return true; } catch (e) { if (e && e.code === "invalid_argument") { canWrite = false; toast("Lecture seule : demandez l'accès Contributeur"); } else if (e && e.code === "quota_exceeded") toast("La base est pleine"); else toast("Enregistrement impossible, réessayez"); return false; } }
async function log(texte) { if (!db) return; try { await db.collection("activite").add({ texte, par: me, le: Date.now() }); } catch (e) {} }
async function save(col, id, data, label) {
  const now = Date.now(); const isNew = !id; const ref = isNew ? db.collection(col).doc() : db.doc(col + "/" + id);
  const ok = await guard(() => isNew ? ref.set({ ...data, creePar: me, creeLe: now, majLe: now }) : ref.update({ ...data, majLe: now }));
  if (ok) { log((isNew ? "a ajouté " : "a modifié ") + label); toast(isNew ? "Ajouté" : "Enregistré"); }
  return ok;
}
async function remove(col, id, label) { if (await guard(() => db.doc(col + "/" + id).delete())) { log("a supprimé " + label); toast("Supprimé"); return true; } return false; }

    <section class="panel"><h2>Occupation du mois</h2><div class="occ">${s.per.map(a => `<div><div class="l"><b>${esc(a.nom)}</b><span class="num">${a.nuits} / ${monthDays(ym)} nuits · ${F(a.ca)}</span></div><div class="track"><div class="fill" style="width:${a.occ * 100}%"></div></div></div>`).join("")}</div>

function vCal() {
  const days = monthDays(ym), [y, mo] = ym.split("-").map(Number), t = today();
  const cols = `grid-template-columns:130px repeat(${days},minmax(22px,1fr))`;
  let h = `<div></div>`;
  for (let d = 1; d <= days; d++) { const dt = new Date(y, mo - 1, d); const we = dt.getDay() === 0 || dt.getDay() === 6; h += `<div class="h ${we ? "we" : ""}">${"dlmmjvs"[dt.getDay()]}<br>${d}</div>`; }
  for (const a of APTS) {
    h += `<div class="apt" style="grid-row:span 1">${esc(a.court)}</div>`;
    const rs = R.filter(r => active(r) && r.apt === a.id && nightsInMonth(r, ym) > 0).sort((p, q) => p.arrivee.localeCompare(q.arrivee));
    let day = 1;

      const s = Math.max(1, D(r.arrivee) < new Date(y, mo - 1, 1) ? 1 : D(r.arrivee).getDate()), n = nightsInMonth(r, ym);
      while (day < s) { h += `<div class="d ${`${ym}-${String(day).padStart(2, "0")}` === t ? "today" : ""}" data-add="${a.id}:${ym}-${String(day).padStart(2, "0")}" title="Libre"></div>`; day++; }
      h += `<div class="bk s-${esc(r.statut)}" style="grid-column:span ${n}" data-open="resa:${esc(r.id)}" title="${esc(r.client)} · ${fmtD(r.arrivee)} → ${fmtD(r.depart)}">${esc(r.client || "Réservé")}</div>`; day += n;
    }
    while (day <= days) { h += `<div class="d ${`${ym}-${String(day).padStart(2, "0")}` === t ? "today" : ""}" data-add="${a.id}:${ym}-${String(day).padStart(2, "0")}" title="Libre"></div>`; day++; }
  }
  return `<h1>Calendrier</h1><p class="sub">Une case = une nuit. Touchez une case vide pour créer une réservation à cette date.</p><div class="row">${monthPicker()}</div>
  <div class="calw"><div class="cal" style="${cols}">${h}</div>
  <div class="legend"><span><i style="background:#a38d6f"></i>Demande</span><span><i style="background:#3c6a96"></i>Confirmée</span><span><i style="background:#2f7a4b"></i>Payée</span></div></div>`;
}
